name: "AI Pull Request Description Generator"

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  generate-description:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

      - name: Build PR context
        id: context
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"

          {
            echo "## Commit Messages"
            git log --pretty=format:"- %s" "$BASE..HEAD" || echo "(none)"

            echo -e "\n\n## Files Changed"
            git diff --stat "$BASE..HEAD" || echo "(none)"

            echo -e "\n\n## Code Signatures (declarations added/removed)"
            # A cleaner, structured diff grabber
            git diff "$BASE..HEAD" \
              | grep -E '^[+-][[:space:]]*(fun |class |interface |object |data class |sealed |@Composable|suspend |override |enum )' \
              | grep -v '^[+-][+-][+-]' \
              | sed 's/^+/[+] /' \
              | sed 's/^-/[-] /' \
              | sort -u \
              | head -n 150 || echo "(none)"

            echo -e "\n\n## Per-File Added Content"
            while IFS= read -r file; do
              echo -e "\n### $file"
              git diff "$BASE..HEAD" -- "$file" \
                | grep '^+' \
                | grep -v '^+++' \
                | grep -v '^\+[[:space:]]*//' \
                | grep -v '^\+[[:space:]]*$' \
                | sed 's/^+//' \
                | head -n 40 || echo "(no additions)"
            done < <(git diff --name-only --diff-filter=AM "$BASE..HEAD" | head -n 30)

          } > context.txt

          # Safe line-based truncation (approx 60-80k tokens max safely)
          MAX_LINES=8000
          ACTUAL_LINES=$(wc -l < context.txt)
          if [ "$ACTUAL_LINES" -gt "$MAX_LINES" ]; then
            echo "context.txt is too large, capping lines."
            head -n "$MAX_LINES" context.txt > context_trimmed.txt
            echo -e "\n\n[... Remaining diff truncated cleanly to protect context window ...]" >> context_trimmed.txt
            mv context_trimmed.txt context.txt
          fi

      - name: Generate PR description via OpenRouter
        id: ai
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Streamlined prompt optimized for Free-tier reasoning models
          python3 - << 'PYEOF'
          prompt = """You are a technical writer translating code diffs into clear pull request documentation.

          CRITICAL INSTRUCTIONS:
          - Write in clear, complete prose sentences.
          - Do NOT produce trailing symbols, empty strings, or loops of punctuation (e.g., do NOT write ", , ,").
          - Avoid outputting raw code snippets or variable decorations. Explain the concept instead.

          Strictly structure your response exactly as follows:

          ## Summary
          Provide a 3-4 sentence high-level explanation of why this change was introduced and how it works architecturally.

          ## Technical Changes
          Provide a clean markdown bulleted list (6-8 bullets max) describing the core changes.
          Example:
          - **Repository Layer**: Introduced user retrieval methods returning reactive Streams.
          """
          with open("prompt.txt", "w") as f:
              f.write(prompt)
          PYEOF

          printf "\n\n## Git Diff Context to Analyze:\n\n" >> prompt.txt
          cat context.txt >> prompt.txt

          # Re-ordered with highly robust free-tier options first
          MODELS=(
            "meta-llama/llama-3.3-70b-instruct:free"
            "qwen/qwen3-coder:free"
            "google/gemma-4-31b-it:free"
            "google/gemma-4-26b-a4b-it:free"
          )

          for MODEL in "${MODELS[@]}"; do
            echo "Trying model: $MODEL"

            jq -n \
              --arg model "$MODEL" \
              --arg system "You are an expert software engineer writing concise, grammatically flawless pull request descriptions. Do not loop punctuation." \
              --rawfile prompt prompt.txt \
              '{
                model: $model,
                max_tokens: 1500,
                temperature: 0.1,
                messages: [
                  { role: "system", content: $system },
                  { role: "user", content: $prompt }
                ]
              }' > payload.json

            HTTP_CODE=$(curl -s -w "%{http_code}" -o response.json \
              https://openrouter.ai/api/v1/chat/completions \
              -H "Authorization: Bearer $OPENROUTER_API_KEY" \
              -H "Content-Type: application/json" \
              -H "HTTP-Referer: https://github.com/${{ github.repository }}" \
              -H "X-Title: PR Description Generator" \
              -d @payload.json)

            if [ "$HTTP_CODE" = "200" ]; then
              # Clean up any residual artifact errors common in cheap endpoints
              DESCRIPTION=$(jq -r '.choices[0].message.content // empty' response.json | sed 's/ ,/,/g')
              if [ -n "$DESCRIPTION" ]; then
                echo "Success with model: $MODEL"
                {
                  echo "description<<DESCEOF"
                  echo "$DESCRIPTION"
                  echo "DESCEOF"
                } >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "Failed with $MODEL (HTTP $HTTP_CODE), trying next..."
            fi
          done

          echo "All models failed"
          {
            echo "description<<DESCEOF"
            echo "### Manual Summary Needed\nAI generation was unavailable or timed out."
            echo "DESCEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update PR body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > new_body.txt
          ### AI-Generated Pull Request Summary

          ${{ steps.ai.outputs.description }}

          ---
          *Generated by AI - please review and edit as needed*
          EOF

          gh pr edit ${{ github.event.pull_request.number }} --body-file new_body.txt
