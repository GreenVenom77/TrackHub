name: "AI Pull Request Description Generator"

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  generate-description:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

      - name: Get commit messages and code changes
        id: context
        run: |
          {
            echo "### Commit Messages"
            git log --pretty=format:"- %s" origin/${{ github.event.pull_request.base.ref }}..HEAD || echo "(No commits)"
            
            echo -e "\n\n### Files Changed"
            git diff --name-status --diff-filter=AM origin/${{ github.event.pull_request.base.ref }}..HEAD || echo "(No files)"
            
            echo -e "\n\n### Added/Modified Code (Key Signatures)"
            # Show actual added lines with function/class declarations
            git diff origin/${{ github.event.pull_request.base.ref }}..HEAD | grep '^+' | grep -v '^+++' | grep -E '(fun |class |interface |object |data class |sealed |@Composable|suspend |override |val |var |enum )' | sed 's/^+//' | head -200 || echo "(No signatures)"
            
            echo -e "\n\n### Full Diff"
            git diff origin/${{ github.event.pull_request.base.ref }}..HEAD
          } > context.txt
          
          {
            echo "context<<CONTEXTEOF"
            cat context.txt
            echo "CONTEXTEOF"
          } >> $GITHUB_OUTPUT

      - name: Generate AI Pull Request Description
        id: ai
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Create a STRICT prompt that prevents hallucination
          echo "You are writing a COMPREHENSIVE technical GitHub Pull Request description for experienced Android/Kotlin developers.

          ⚠️ CRITICAL ANTI-HALLUCINATION RULES ⚠️
          1. ONLY describe changes you can SEE in the provided diff/commits
          2. NEVER EVER use placeholder commas like: 'Added functions , , , and'
          3. If you see a function name like 'inviteUser()', COPY IT EXACTLY with full signature: 'inviteUser(userId: String, role: HubRole): Result<Unit>'
          4. If you cannot see a function name clearly, DO NOT mention functions at all - describe the feature generically
          5. Include as many technical details as you can extract from the diff

          Write a DETAILED technical PR description with:

          ## Summary
          3-4 sentences about what changed technically, the architectural approach, and key implementation patterns used

          ## Technical Changes
          6-10 bullet points with COMPREHENSIVE implementation details. Be thorough and specific.

          For each bullet, include:
          - Exact function signatures with parameter types and return types
          - State management patterns (StateFlow, MutableStateFlow, State, remember{})
          - Data structures (data classes with all fields you can see)
          - UI patterns (Composables, modifiers, LazyColumn specifics)
          - Error handling approaches (Result<T>, try-catch, sealed classes)
          - Reactive patterns (Flow, collect, debounce timing)
          - Navigation and dialog state management
          - Any DTOs, mappers, or data transformations
          - Network/database operations (RPC calls, queries, endpoints)
          - Validation logic or business rules

          Format: **Component/Layer - Specific Feature**: Detailed technical description with multiple function signatures, patterns, and implementation details

          GOOD examples (comprehensive with details):
          - **HubInvitationsRepository - Member Operations**: Implemented inviteUser(userId: String, role: HubRole): Flow<Result<InvitationResult>>, removeUserFromHub(userId: String): Flow<Result<Unit>>, changeUserRole(userId: String, newRole: HubRole): Flow<Result<Unit>>, and getAllMembers(): Flow<Result<List<HubMember>>> using Supabase RPC calls with proper error wrapping and Result type handling
          - **HubDetailsViewModel - State Management**: Added StateFlow<List<HubMember>> for membersList, StateFlow<List<UserSearch>> for searchResults, StateFlow<Boolean> for loading states, MutableStateFlow<String> for searchQuery with 600ms debounce via searchQuery.debounce(600).collectLatest{}, handles SearchForUsers/InviteUser/ChangeMemberRole/RemoveMember actions with proper error state updates
          - **Domain Models - Data Structures**: Created HubMember(userId: String, name: String, email: String, role: HubRole, status: MemberStatus, joinedAt: LocalDateTime), InvitationResult(success: Boolean, message: String, invitationStatus: InvitationStatus), UserSearch(userId: String, displayName: String, email: String, currentStatus: MemberStatus?) with proper nullable handling
          - **InviteUserDialog Composable - UI Implementation**: Built with Column(Modifier.fillMaxWidth().padding(24.dp)), SearchTextField with OutlinedTextField(value, onValueChange, leadingIcon = Icon(Icons.Search)), LazyColumn for search results showing UserSearchItem composables, RoleSelectionDropdown with DropdownMenu containing HubRole.entries.map{}, AnimatedVisibility for loading/error states, confirmation Button with enabled state tied to selected user and role

          ACCEPTABLE generic examples (when specific names aren't visible):
          - **Data Source Layer - Supabase Integration**: Implemented RPC client wrapper with error handling, request/response DTOs, and Result type mapping for all hub member operations
          - **UI Components - Dialog System**: Created reusable dialog composables with Material3 styling, gradient backgrounds, animated state transitions, and proper dismissal handling

          FORBIDDEN examples (NEVER DO THIS):
          - **Repository**: Added functions , , , and for member management ❌
          - **ViewModel**: Implemented state management ❌ (too vague)
          - **UI**: Created composables ❌ (no specifics)

          IMPORTANT: Aim for 6-10 detailed bullets. More detail is better. Include implementation specifics, not just feature names.

          Context:
          " > prompt.txt
          
          cat context.txt >> prompt.txt

          # Try multiple models in priority order (best free models for code analysis)
          MODELS=(
            "tngtech/tng-r1t-chimera:free"
            "z-ai/glm-4.5-air:free"
            "openai/gpt-oss-20b:free"
            "x-ai/grok-4.1-fast:free"
            "meta-llama/llama-3.3-70b-instruct:free"
          )
          
          for MODEL in "${MODELS[@]}"; do
            echo "Trying model: $MODEL"
            
            jq -n \
              --arg model "$MODEL" \
              --arg system "You write accurate PR descriptions based only on provided context. Never hallucinate details." \
              --rawfile prompt prompt.txt \
              '{
                model: $model,
                messages: [
                  {role: "system", content: $system},
                  {role: "user", content: $prompt}
                ],
                max_tokens: 2000,
                temperature: 0.3
              }' > payload.json

            HTTP_CODE=$(curl -s -w "%{http_code}" -o response.json \
              https://openrouter.ai/api/v1/chat/completions \
              -H "Authorization: Bearer $OPENROUTER_API_KEY" \
              -H "Content-Type: application/json" \
              -H "HTTP-Referer: https://github.com/${{ github.repository }}" \
              -H "X-Title: PR Description Generator" \
              -d @payload.json)

            echo "HTTP Status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              DESCRIPTION=$(jq -r '.choices[0].message.content // empty' response.json)
              
              if [ -n "$DESCRIPTION" ]; then
                echo "Success with model: $MODEL"
                {
                  echo "description<<DESCEOF"
                  echo "$DESCRIPTION"
                  echo "DESCEOF"
                } >> $GITHUB_OUTPUT
                exit 0
              fi
            else
              echo "Failed with $MODEL, trying next..."
              cat response.json
            fi
          done
          
          # If all models failed
          echo "All models failed"
          {
            echo "description<<DESCEOF"
            echo "⚠️ Failed to generate AI description. Please check workflow logs for details."
            echo ""
            echo "### Manual Summary Needed"
            echo "Please add a description for this PR."
            echo "DESCEOF"
          } >> $GITHUB_OUTPUT

      - name: Update PR body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "### AI-Generated Pull Request Summary" > new_body.txt
          echo "" >> new_body.txt
          echo "${{ steps.ai.outputs.description }}" >> new_body.txt
          echo "" >> new_body.txt
          echo "---" >> new_body.txt
          echo "*Generated by AI - please review and edit as needed*" >> new_body.txt
          
          gh pr edit ${{ github.event.pull_request.number }} --body-file new_body.txt
