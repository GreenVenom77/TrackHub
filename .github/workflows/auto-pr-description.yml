name: "AI Pull Request Description Generator"

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  generate-description:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for proper diffs

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

      - name: Get commit messages and diff summary (safe)
        id: context
        run: |
          echo "### Commits" > context.txt
          git log --pretty=format:"- %s" origin/${{ github.event.pull_request.base.ref }}..HEAD >> context.txt || echo "(No commits found)" >> context.txt
          echo -e "\n\n### Diff Summary" >> context.txt
          git diff --stat origin/${{ github.event.pull_request.base.ref }}..HEAD >> context.txt || echo "(No diff found)" >> context.txt

          # Truncate context if too large (>25KB) to avoid hitting API limits
          MAX_BYTES=25000
          ACTUAL_BYTES=$(wc -c < context.txt)
          if [ "$ACTUAL_BYTES" -gt "$MAX_BYTES" ]; then
            echo -e "\n\n[Note: diff truncated for size]" >> context.txt
            head -c $MAX_BYTES context.txt > truncated.txt && mv truncated.txt context.txt
          fi

          echo "context<<EOF" >> $GITHUB_OUTPUT
          cat context.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate AI Pull Request Description
        id: ai
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"z-ai/glm-4.5-air:free\",
              \"messages\": [
                {
                  \"role\": \"system\",
                  \"content\": \"You are an AI assistant that writes clear, concise, and professional GitHub Pull Request descriptions.\"
                },
                {
                  \"role\": \"user\",
                  \"content\": \"You are writing a technical PR description for developers. Be precise, concise, and focus on implementation details.\\n\\nGenerate a pull request description in Markdown format with these sections:\\n\\n## Summary\\n2-3 sentences. Describe what was changed technically and the architectural impact. No business justification needed.\\n\\nExample: \\\"Implemented filtering system for Hub items with category and manufacturer support. Refactored Repository layer to use Flow-based queries with Paging3 integration.\\\"\\n\\n## Technical Changes\\n3-5 bullet points maximum. Each bullet should cover ONE distinct technical change. Format:\\n- **Component/Layer changed** — **Implementation details** (classes, libraries, patterns used)\\n\\nExample format:\\n- Filtering UI implementation — Added FilterDropdown composable with StateFlow state management, integrated into HubDetailsScreen and HubCreateScreen with multi-select support\\n- Repository layer refactor — Updated HubRepository to accept filter parameters, implemented Flow<PagingData> queries using Room @Query with dynamic WHERE clauses\\n\\nGUIDELINES:\\n- Write for developers who will review or maintain this code\\n- Include: Specific classes/files, libraries (Room, Retrofit, Compose, Paging3), architectural patterns (MVVM, Repository), data structures\\n- Mention database changes (schema updates, new DAOs, query modifications)\\n- Include API changes (new endpoints, request/response models)\\n- Each bullet = different layer/component (UI, ViewModel, Repository, DAO, API, etc.)\\n- Combine related changes in same layer into one bullet\\n- BANNED: LOC, file counts, performance metrics, marketing language, business justifications\\n- Be specific with class names when relevant (e.g., HubRepository, ItemDao, FilterDropdown)\\n- Skip minor changes (imports, formatting, validation regex)\\n\\nContext:\\n${{ steps.context.outputs.context }}\"
                }
              ]
            }")

          DESCRIPTION=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "No description generated."')
          echo "description<<EOF" >> $GITHUB_OUTPUT
          echo "$DESCRIPTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Overwrite PR body completely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### AI-Generated Pull Request Summary"
            echo ""
            echo "${{ steps.ai.outputs.description }}"
          } > new_body.txt

          gh pr edit ${{ github.event.pull_request.number }} --body-file new_body.txt
