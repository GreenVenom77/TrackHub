name: "AI Pull Request Description Generator"

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  generate-description:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

      - name: Get commit messages and code changes
        id: context
        run: |
          {
            echo "### Commit Messages"
            git log --pretty=format:"- %s" origin/${{ github.event.pull_request.base.ref }}..HEAD || echo "(No commits)"
            
            echo -e "\n\n### Files Changed"
            git diff --name-status --diff-filter=AM origin/${{ github.event.pull_request.base.ref }}..HEAD || echo "(No files)"
            
            echo -e "\n\n### File Statistics"
            git diff --stat origin/${{ github.event.pull_request.base.ref }}..HEAD || echo "(No stats)"
            
            echo -e "\n\n### Code Changes (Function/Class Signatures Only)"
            # Extract only function signatures, class declarations, and important annotations
            git diff origin/${{ github.event.pull_request.base.ref }}..HEAD | grep -E '^\+.*(fun |class |interface |object |data class |sealed |@Composable|suspend |override )' | head -100 || echo "(No signatures found)"
            
            echo -e "\n\n### Full Diff (Limited)"
            git diff --unified=3 origin/${{ github.event.pull_request.base.ref }}..HEAD || echo "(No diff)"
          } > context.txt
          
          {
            echo "context<<CONTEXTEOF"
            cat context.txt
            echo "CONTEXTEOF"
          } >> $GITHUB_OUTPUT

      - name: Generate AI Pull Request Description
        id: ai
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Create a STRICT prompt that prevents hallucination
          echo "You are writing a technical GitHub Pull Request description for experienced Android/Kotlin developers.

          CRITICAL RULES:
          1. ONLY describe changes you can SEE in the provided diff/commits
          2. NEVER invent method names, class names, or technologies not shown
          3. Include technical specifics: function signatures, data types, architectural patterns, state management
          4. NEVER use placeholder commas like 'Added , , ,' - skip details you don't have
          5. When describing UI, mention Composable functions, state flows, and UI patterns you can see
          6. When describing data layer, mention repository patterns, data classes, and API structures you can see
          7. Focus on HOW things work technically, not just WHAT changed

          Write a technical PR description with:

          ## Summary
          2-3 sentences about what changed technically and the architectural approach

          ## Technical Changes
          4-6 bullet points with implementation details. Format:
          **Component/Layer**: Technical description with specifics (function names, types, patterns, state management)

          Examples of GOOD technical bullets:
          - **HubMemberRepository**: Added \`getMemberList()\`, \`updateMemberRole(memberId: String, role: HubRole)\`, \`removeMember()\` with Flow<Result<T>> return types for reactive state management
          - **User invitation flow**: Implemented \`InvitationViewModel\` with StateFlow<List<InvitableUser>>, search debouncing via \`searchQuery.debounce(300)\`, role selection with sealed class \`InvitationState\`
          - **Hub Details UI**: Refactored \`HubDetailsScreen\` Composable with LazyColumn member list, \`MemberListItem\` with role chips, BottomSheet modals for edit/delete actions, remember { mutableStateOf() } for dialog visibility
          - **Domain models**: Created \`HubMember\` data class with userId/role/status fields, \`HubRole\` enum (OWNER/EDITOR/VIEWER), \`InvitationStatus\` sealed interface for type-safe state

          Examples of BAD bullets (DO NOT DO THIS):
          - **Member management**: Added member features (TOO VAGUE)
          - **Repository layer**: Updated repository (NO TECHNICAL DETAILS)
          - **UI improvements**: Made UI better (NO SPECIFICS)

          Include: Composable functions, ViewModel patterns, StateFlow/MutableStateFlow, data classes, sealed classes/interfaces, 
          repository patterns, Room queries (if present), Retrofit endpoints (if present), navigation flows, state management approaches.

          If you cannot see specific implementation details in the diff, describe the pattern/approach generically but still technically.

          Context:
          " > prompt.txt
          
          cat context.txt >> prompt.txt

          # Try multiple models in priority order
          MODELS=("z-ai/glm-4.5-air:free" "kwaipilot/kat-coder-pro:free" "google/gemini-flash-1.5:free" "meta-llama/llama-3.1-8b-instruct:free")
          
          for MODEL in "${MODELS[@]}"; do
            echo "Trying model: $MODEL"
            
            jq -n \
              --arg model "$MODEL" \
              --arg system "You write accurate PR descriptions based only on provided context. Never hallucinate details." \
              --rawfile prompt prompt.txt \
              '{
                model: $model,
                messages: [
                  {role: "system", content: $system},
                  {role: "user", content: $prompt}
                ],
                max_tokens: 800,
                temperature: 0.3
              }' > payload.json

            HTTP_CODE=$(curl -s -w "%{http_code}" -o response.json \
              https://openrouter.ai/api/v1/chat/completions \
              -H "Authorization: Bearer $OPENROUTER_API_KEY" \
              -H "Content-Type: application/json" \
              -H "HTTP-Referer: https://github.com/${{ github.repository }}" \
              -H "X-Title: PR Description Generator" \
              -d @payload.json)

            echo "HTTP Status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              DESCRIPTION=$(jq -r '.choices[0].message.content // empty' response.json)
              
              if [ -n "$DESCRIPTION" ]; then
                echo "Success with model: $MODEL"
                {
                  echo "description<<DESCEOF"
                  echo "$DESCRIPTION"
                  echo "DESCEOF"
                } >> $GITHUB_OUTPUT
                exit 0
              fi
            else
              echo "Failed with $MODEL, trying next..."
              cat response.json
            fi
          done
          
          # If all models failed
          echo "All models failed"
          {
            echo "description<<DESCEOF"
            echo "⚠️ Failed to generate AI description. Please check workflow logs for details."
            echo ""
            echo "### Manual Summary Needed"
            echo "Please add a description for this PR."
            echo "DESCEOF"
          } >> $GITHUB_OUTPUT

      - name: Update PR body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "### AI-Generated Pull Request Summary" > new_body.txt
          echo "" >> new_body.txt
          echo "${{ steps.ai.outputs.description }}" >> new_body.txt
          echo "" >> new_body.txt
          echo "---" >> new_body.txt
          echo "*Generated by AI - please review and edit as needed*" >> new_body.txt
          
          gh pr edit ${{ github.event.pull_request.number }} --body-file new_body.txt
