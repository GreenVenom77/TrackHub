name: "AI Pull Request Description Generator"

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  generate-description:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for proper diffs

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

      - name: Get commit messages and code changes
        id: context
        run: |
          # Generate commits section
          echo "### Commits" > context.txt
          git log --pretty=format:"- %s" origin/${{ github.event.pull_request.base.ref }}..HEAD >> context.txt 2>&1 || echo "No commits found" >> context.txt

          # Generate actual code diff (not just stats)
          echo -e "\n\n### Code Changes" >> context.txt
          git diff origin/${{ github.event.pull_request.base.ref }}..HEAD >> context.txt 2>&1 || echo "No diff found" >> context.txt

          # Check size and truncate if needed BEFORE setting output
          MAX_BYTES=25000
          ACTUAL_BYTES=$(wc -c < context.txt)

          if [ "$ACTUAL_BYTES" -gt "$MAX_BYTES" ]; then
            # For large diffs, try to get a more meaningful subset
            echo "### Commits" > context.txt
            git log --pretty=format:"- %s" origin/${{ github.event.pull_request.base.ref }}..HEAD >> context.txt 2>&1

            echo -e "\n\n### Code Changes (truncated)" >> context.txt
            # Get diff with limited context lines to fit more changes
            git diff --unified=1 origin/${{ github.event.pull_request.base.ref }}..HEAD >> context_temp.txt 2>&1

            # Calculate remaining space after commits
            COMMITS_SIZE=$(wc -c < context.txt)
            REMAINING=$((MAX_BYTES - COMMITS_SIZE - 200))

            # Append truncated diff
            head -c $REMAINING context_temp.txt >> context.txt
            echo -e "\n\n[Note: Diff truncated due to size limits. Showing first ${REMAINING} bytes of changes.]" >> context.txt
            rm -f context_temp.txt
          fi

          # Set the output using proper multiline format
          {
            echo "context<<EOF"
            cat context.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate AI Pull Request Description
        id: ai
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "mistralai/devstral-small-2505:free",
              "messages": [
                {
                  "role": "system",
                  "content": "You are an AI assistant that writes clear, concise, and professional GitHub Pull Request descriptions."
                },
                {
                  "role": "user",
                  "content": "Write a technical PR description for developers. Focus on WHAT changed functionally, not WHICH files were modified.\\n\\n## Summary\\n2-3 sentences describing the main technical changes and why they were made.\\n\\n## Technical Changes\\n4-6 bullet points maximum. Each bullet = ONE major feature/change with implementation details.\\n\\nFormat: **Feature/Change** — **Implementation** \\(methods, types, architecture\\)\\n\\nCRITICAL RULES:\\n1. GROUP related changes: If 10 files changed to add filtering, write ONE bullet about filtering\\n2. Focus on features and architecture, not file names\\n3. Include specifics: method signatures, parameters, SQL queries, state patterns, libraries\\n4. Prioritize: major features > refactors > minor changes\\n5. Skip: gradle configs, string resources, minor tweaks\\n\\nGOOD EXAMPLES:\\n✅ FilterDropdown component — Created reusable Composable with selectedItems: StateFlow<List<T>>, onSelectionChange: \\(List<T>\\) -> Unit callbacks, LazyColumn rendering with Checkbox states, keyboard handling\\n✅ Repository filtering — Added categoryIds/manufacturerIds parameters to HubRepository.getHubItems\\(\\), Room @Query with optional IN clauses, returns Flow<PagingData<HubItem>> via Pager\\(pageSize=20\\)\\n✅ Database schema update — Modified HubEntity with non-nullable categoryIds: List<String> using TypeConverter, added migration with NOT NULL constraints and indexes on category_id\\n\\nBAD EXAMPLES \\(DON'T DO THIS\\):\\n❌ HubRepository — Updated repository interface\\n❌ HubMapper — Updated data transformation\\n❌ HubDetailsScreen — Added filter component\\n❌ ItemDao — Implemented new queries\\n\\(These are too vague and file-focused\\)\\n\\nIf you list more than 6 bullets, you're being too granular. Combine related changes.\\n\\nContext:\\n${{ steps.context.outputs.context }}"
                }
              ]
            }')

          DESCRIPTION=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "No description generated."')

          # Set output using proper multiline format
          {
            echo "description<<EOF"
            echo "$DESCRIPTION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Overwrite PR body completely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### AI-Generated Pull Request Summary"
            echo ""
            echo "${{ steps.ai.outputs.description }}"
          } > new_body.txt

          gh pr edit ${{ github.event.pull_request.number }} --body-file new_body.txt
