name: "AI Pull Request Description Generator"

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  generate-description:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for proper diffs

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

      - name: Get commit messages and diff summary (safe)
        id: context
        run: |
          echo "### Commits" > context.txt
          git log --pretty=format:"- %s" origin/${{ github.event.pull_request.base.ref }}..HEAD >> context.txt || echo "(No commits found)" >> context.txt
          echo -e "\n\n### Diff Summary" >> context.txt
          git diff --stat origin/${{ github.event.pull_request.base.ref }}..HEAD >> context.txt || echo "(No diff found)" >> context.txt

          # Truncate context if too large (>25KB) to avoid hitting API limits
          MAX_BYTES=25000
          ACTUAL_BYTES=$(wc -c < context.txt)
          if [ "$ACTUAL_BYTES" -gt "$MAX_BYTES" ]; then
            echo -e "\n\n[Note: diff truncated for size]" >> context.txt
            head -c $MAX_BYTES context.txt > truncated.txt && mv truncated.txt context.txt
          fi

          echo "context<<EOF" >> $GITHUB_OUTPUT
          cat context.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate AI Pull Request Description
        id: ai
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"qwen/qwen3-coder:free\",
              \"messages\": [
                {
                  \"role\": \"system\",
                  \"content\": \"You are an AI assistant that writes clear, concise, and professional GitHub Pull Request descriptions.\"
                },
                {
                  \"role\": \"user\",
                  \"content\": \"Generate a pull request description in Markdown format with the following sections:\\n\\n### Summary\\nA paragraph summarizing what the PR does and why.\\n\\n### Changes\\nList the main code or feature modifications in bullet points.\\n\\nIMPORTANT: If commit messages are vague or just filenames, analyze the diff summary to understand what was actually changed. Provide meaningful descriptions based on the code changes, not just the commit text.\\n\\nHere are the commit messages and diff summary:\\n${{ steps.context.outputs.context }}\"
                }
              ]
            }")

          DESCRIPTION=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "No description generated."')
          echo "description<<EOF" >> $GITHUB_OUTPUT
          echo "$DESCRIPTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Overwrite PR body completely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### AI-Generated Pull Request Summary"
            echo ""
            echo "${{ steps.ai.outputs.description }}"
          } > new_body.txt

          gh pr edit ${{ github.event.pull_request.number }} --body-file new_body.txt
