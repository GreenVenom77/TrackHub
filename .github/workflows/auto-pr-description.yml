name: "AI Pull Request Description Generator"

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  generate-description:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

      - name: Build PR context
        id: context
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"

          {
            echo "## Commit Messages"
            git log --pretty=format:"- %s" "$BASE..HEAD" || echo "(none)"

            echo -e "\n\n## Files Changed"
            git diff --stat "$BASE..HEAD" || echo "(none)"

            echo -e "\n\n## New Files"
            git diff --name-status --diff-filter=A "$BASE..HEAD" | awk '{print $2}' || echo "(none)"

            echo -e "\n\n## Deleted Files"
            git diff --name-status --diff-filter=D "$BASE..HEAD" | awk '{print $2}' || echo "(none)"

            echo -e "\n\n## Code Signatures (declarations added/removed)"
            git diff "$BASE..HEAD" \
              | grep -E '^[+-]' \
              | grep -v '^[+-][+-][+-]' \
              | grep -E '(fun |class |interface |object |data class |sealed |@Composable|suspend |override |enum |typealias |val |var )' \
              | sed 's/^+/[+] /' \
              | sed 's/^-/[-] /' \
              | sort -u \
              | head -300 \
              || echo "(none)"

            echo -e "\n\n## Per-File Added Content"
            while IFS= read -r file; do
              echo -e "\n### $file"
              git diff "$BASE..HEAD" -- "$file" \
                | grep '^+' \
                | grep -v '^+++' \
                | grep -v '^\+[[:space:]]*//' \
                | grep -v '^\+[[:space:]]*$' \
                | sed 's/^+//' \
                | head -60 \
                || echo "(no additions)"
            done < <(git diff --name-only --diff-filter=AM "$BASE..HEAD")

          } > context.txt

          # Cap at 450k chars (~112k tokens), leaving ~19k headroom for prompt +
          # output within a 131k-context model.
          MAX_CHARS=450000
          ACTUAL=$(wc -c < context.txt)
          if [ "$ACTUAL" -gt "$MAX_CHARS" ]; then
            echo "context.txt is ${ACTUAL} chars, capping at ${MAX_CHARS}"
            head -c "$MAX_CHARS" context.txt > context_trimmed.txt
            echo -e "\n\n[... truncated to fit model context window ...]" >> context_trimmed.txt
            mv context_trimmed.txt context.txt
          fi

          {
            echo "context<<CONTEXTEOF"
            cat context.txt
            echo "CONTEXTEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate PR description via OpenRouter
        id: ai
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Write prompt via python to avoid heredoc YAML indentation issues
          python3 - << 'PYEOF'
          prompt = """You are writing a technical GitHub Pull Request description for experienced Android/Kotlin developers.

          RULES:
          1. SUMMARIZE changes - do NOT copy code verbatim
          2. Describe WHAT was implemented and HOW it works architecturally
          3. Include function names and types naturally in sentences, not as raw code
          4. Focus on the developer's intent and architectural patterns
          5. NEVER use placeholder commas like: "Added functions , , , and"

          BAD examples (do not do this):
          - Added Column(Modifier.fillMaxWidth().padding(24.dp))
          - Uses filter{ SharedHubResponse::hubId eq leaveHubRequest.hubId }
          - Implements rememberSaveable{ mutableStateOf(false) }

          GOOD examples (do this instead):
          - Created InviteUserDialog composable with Material3 AlertDialog, lazy-loaded user list, and role selection dropdown
          - Implemented leave hub functionality with Supabase delete operation and local cache invalidation
          - Added dialog state management using rememberSaveable for persistence across recompositions

          Write the PR description using this structure:

          ## Summary
          3-4 sentences explaining the feature, architectural approach, and key technical decisions.

          ## Technical Changes
          6-8 bullet points. Each should:
          - Start with **Component Name**:
          - Describe what changed in 1-2 sentences
          - Mention key function names naturally
          - Note important types like Flow<Result<T>>, StateFlow, or sealed classes where relevant
          - Explain HOW things work, not just list names

          Good bullet example:
          - **HubInvitationsRepository**: Added member management via inviteUser(), removeMember(), and changeUserRole(), all returning Flow<Result<T>> for reactive state handling.

          Bad bullet example:
          - **Repository**: Added suspend fun inviteUser(request: UserInviteRequest): NetworkResult<InvitationResult, NetworkError>
          """
          with open("prompt.txt", "w") as f:
              f.write(prompt)
          PYEOF

          printf "\n\n## PR Context\n\n" >> prompt.txt
          cat context.txt >> prompt.txt

          MODELS=(
            "z-ai/glm-4.5-air:free"
            "qwen/qwen3-coder:free"
            "google/gemma-4-31b-it:free"
            "openrouter/elephant-alpha"
            "meta-llama/llama-3.3-70b-instruct:free"
          )

          for MODEL in "${MODELS[@]}"; do
            echo "Trying model: $MODEL"

            jq -n \
              --arg model "$MODEL" \
              --arg system "You are a technical writer summarizing code changes for developers. Describe WHAT changed and HOW it works architecturally. Never copy code verbatim." \
              --rawfile prompt prompt.txt \
              '{
                model: $model,
                max_tokens: 2000,
                temperature: 0.3,
                messages: [
                  { role: "system", content: $system },
                  { role: "user", content: $prompt }
                ]
              }' > payload.json

            HTTP_CODE=$(curl -s -w "%{http_code}" -o response.json \
              https://openrouter.ai/api/v1/chat/completions \
              -H "Authorization: Bearer $OPENROUTER_API_KEY" \
              -H "Content-Type: application/json" \
              -H "HTTP-Referer: https://github.com/${{ github.repository }}" \
              -H "X-Title: PR Description Generator" \
              -d @payload.json)

            echo "HTTP status: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              DESCRIPTION=$(jq -r '.choices[0].message.content // empty' response.json)
              if [ -n "$DESCRIPTION" ]; then
                echo "Success with model: $MODEL"
                {
                  echo "description<<DESCEOF"
                  echo "$DESCRIPTION"
                  echo "DESCEOF"
                } >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "Failed with $MODEL, trying next..."
              cat response.json
            fi
          done

          echo "All models failed"
          {
            echo "description<<DESCEOF"
            echo "Failed to generate AI description - check workflow logs."
            echo ""
            echo "### Manual Summary Needed"
            echo "Please add a description for this PR."
            echo "DESCEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update PR body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### AI-Generated Pull Request Summary"
            echo ""
            echo "${{ steps.ai.outputs.description }}"
            echo ""
            echo "---"
            echo "*Generated by AI - please review and edit as needed*"
          } > new_body.txt

          gh pr edit ${{ github.event.pull_request.number }} --body-file new_body.txt
