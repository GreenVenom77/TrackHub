name: "AI Pull Request Description Generator"

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  generate-description:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for proper diffs

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Get commit messages and code changes
        id: context
        run: |
          # Generate commits section
          echo "### Commits" > context.txt
          git log --pretty=format:"- %s" origin/${{ github.event.pull_request.base.ref }}..HEAD >> context.txt 2>&1 || echo "No commits found" >> context.txt

          # Generate code diff for ADDED and MODIFIED files only (ignore deleted, renamed, etc.)
          echo -e "\n\n### Code Changes (Added & Modified Files Only)" >> context.txt
          git diff --diff-filter=AM origin/${{ github.event.pull_request.base.ref }}..HEAD >> context.txt 2>&1 || echo "No diff found for added/modified files" >> context.txt

          # Check size and truncate if needed
          MAX_BYTES=25000
          ACTUAL_BYTES=$(wc -c < context.txt)

          if [ "$ACTUAL_BYTES" -gt "$MAX_BYTES" ]; then
            echo "### Commits" > context_temp.txt
            git log --pretty=format:"- %s" origin/${{ github.event.pull_request.base.ref }}..HEAD >> context_temp.txt 2>&1

            echo -e "\n\n### Code Changes (Added & Modified Files Only - truncated)" >> context_temp.txt
            git diff --diff-filter=AM --unified=1 origin/${{ github.event.pull_request.base.ref }}..HEAD >> context_temp2.txt 2>&1

            COMMITS_SIZE=$(wc -c < context_temp.txt)
            REMAINING=$((MAX_BYTES - COMMITS_SIZE - 200))

            head -c $REMAINING context_temp2.txt >> context_temp.txt
            echo -e "\n\n[Note: Diff truncated due to size limits. Showing first ${REMAINING} bytes of changes from added/modified files only.]" >> context_temp.txt

            mv context_temp.txt context.txt
            rm -f context_temp2.txt
          fi

          # Show summary of changed files
          echo -e "\n\n### Changed Files Summary" >> context.txt
          echo "Added files:" >> context.txt
          git diff --name-only --diff-filter=A origin/${{ github.event.pull_request.base.ref }}..HEAD >> context.txt 2>&1 || echo "No added files" >> context.txt
          echo -e "\nModified files:" >> context.txt
          git diff --name-only --diff-filter=M origin/${{ github.event.pull_request.base.ref }}..HEAD >> context.txt 2>&1 || echo "No modified files" >> context.txt

          # Set the output using proper multiline format
          CONTENT=$(cat context.txt)
          echo "context<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Cleanup
          rm -f context.txt

      - name: Generate AI Pull Request Description
        id: ai
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Create a temporary file for the JSON payload
          cat > payload.json << 'EOF'
          {
            "model": "mistralai/devstral-small-2505:free",
            "messages": [
              {
                "role": "system",
                "content": "You are an AI assistant that writes clear, concise, and professional GitHub Pull Request descriptions. Focus only on code changes in ADDED and MODIFIED files."
              },
              {
                "role": "user",
                "content": "Write a technical PR description for developers. Focus on WHAT changed functionally, not WHICH files were modified. ONLY consider changes in ADDED and MODIFIED files.\n\n## Summary\n2-3 sentences describing the main technical changes and why they were made.\n\n## Technical Changes\n4-6 bullet points maximum. Each bullet = ONE major feature/change with implementation details.\n\nFormat: **Feature/Change** — **Implementation** (methods, types, architecture)\n\nCRITICAL RULES:\n1. ONLY analyze ADDED and MODIFIED files (ignore deleted, renamed, copied files)\n2. GROUP related changes: If 10 files changed to add filtering, write ONE bullet about filtering\n3. Focus on features and architecture, not file names\n4. Include specifics: method signatures, parameters, SQL queries, state patterns, libraries\n5. Prioritize: major features > refactors > minor changes\n6. Skip: gradle configs, string resources, minor tweaks\n\nGOOD EXAMPLES:\n✅ FilterDropdown component — Created reusable Composable with selectedItems: StateFlow<List<T>>, onSelectionChange: (List<T>) -> Unit callbacks, LazyColumn rendering with Checkbox states, keyboard handling\n✅ Repository filtering — Added categoryIds/manufacturerIds parameters to HubRepository.getHubItems(), Room @Query with optional IN clauses, returns Flow<PagingData<HubItem>> via Pager(pageSize=20)\n✅ Database schema update — Modified HubEntity with non-nullable categoryIds: List<String> using TypeConverter, added migration with NOT NULL constraints and indexes on category_id\n\nBAD EXAMPLES (DON'T DO THIS):\n❌ HubRepository — Updated repository interface\n❌ HubMapper — Updated data transformation\n❌ HubDetailsScreen — Added filter component\n❌ ItemDao — Implemented new queries\n(These are too vague and file-focused)\n\nIf you list more than 6 bullets, you're being too granular. Combine related changes.\n\nContext:\n${{ steps.context.outputs.context }}"
              }
            ]
          }
          EOF

          # Make API call with error handling
          RESPONSE=$(curl -s -w "\n%{http_code}" https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d @payload.json)

          # Extract HTTP status code and response body
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')

          # Check if API call was successful
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Error: API call failed with status code $HTTP_CODE"
            echo "Response: $RESPONSE_BODY"
            DESCRIPTION="⚠️ Failed to generate AI description. API returned status code $HTTP_CODE."
          else
            # Validate JSON response
            if echo "$RESPONSE_BODY" | jq empty 2>/dev/null; then
              DESCRIPTION=$(echo "$RESPONSE_BODY" | jq -r '.choices[0].message.content // "⚠️ No description generated by AI."')

              # Check if description is empty or null
              if [ -z "$DESCRIPTION" ] || [ "$DESCRIPTION" = "null" ]; then
                DESCRIPTION="⚠️ AI returned empty description."
              fi
            else
              echo "Error: Invalid JSON response"
              echo "Response: $RESPONSE_BODY"
              DESCRIPTION="⚠️ Failed to parse AI response. Invalid JSON returned."
            fi
          fi

          # Set output using proper multiline format
          echo "description<<EOF" >> $GITHUB_OUTPUT
          echo "$DESCRIPTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Cleanup
          rm -f payload.json

      - name: Update PR description
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > new_body.txt << 'EOF'
          ### AI-Generated Pull Request Summary

          ${{ steps.ai.outputs.description }}

          ---
          EOF

          # Update PR with error handling
          if gh pr edit ${{ github.event.pull_request.number }} --body-file new_body.txt; then
            echo "✅ PR description updated successfully"
          else
            echo "❌ Failed to update PR description"
            exit 1
          fi

          # Cleanup
          rm -f new_body.txt
