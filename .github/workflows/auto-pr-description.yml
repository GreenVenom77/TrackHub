name: "AI Pull Request Description Generator"

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  generate-description:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

      - name: Get commit messages and code changes
        id: context
        run: |
          # Create context content
          {
            echo "### Commits"
            git log --pretty=format:"- %s" origin/${{ github.event.pull_request.base.ref }}..HEAD || echo "(No commits)"

            echo -e "\n\n### File Changes"
            git diff --stat --diff-filter=AM origin/${{ github.event.pull_request.base.ref }}..HEAD || echo "(No diff)"

            echo -e "\n\n### Code Changes"
            # Limit diff context and size
            git diff --unified=2 --diff-filter=AM origin/${{ github.event.pull_request.base.ref }}..HEAD || echo "(No changes)"
          } > context.txt

          # Aggressively truncate to 15KB to ensure it fits
          MAX_BYTES=15000
          if [ $(wc -c < context.txt) -gt "$MAX_BYTES" ]; then
            head -c $MAX_BYTES context.txt > truncated.txt
            echo -e "\n\n[Diff truncated for size]" >> truncated.txt
            mv truncated.txt context.txt
          fi

          # Output the context
          {
            echo "context<<EOF"
            cat context.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Generate AI Pull Request Description
        id: ai
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Create concise prompt
          cat > prompt.txt << 'PROMPT_EOF'
            Write a technical PR description for developers.

            ## Summary
            2-3 sentences describing the main changes and why.

            ## Technical Changes
            4-6 bullet points maximum. Focus on WHAT changed functionally.

            Format: **Feature** — Implementation details (methods, types, architecture)

            Rules:
            - Group related changes together
            - Focus on features/architecture, not file names
            - Include specifics: method signatures, patterns, libraries
            - Skip minor tweaks and config changes

            Context:
            PROMPT_EOF

          # Append context
          cat context.txt >> prompt.txt

          # Create JSON payload with proper escaping
          jq -n \
            --arg model "x-ai/grok-4.1-fast:free" \
            --arg system "You are a technical writer creating concise GitHub PR descriptions." \
            --rawfile prompt prompt.txt \
            '{
              model: $model,
              messages: [
                {role: "system", content: $system},
                {role: "user", content: $prompt}
              ],
              max_tokens: 1000,
              temperature: 0.7
            }' > payload.json

          # Make API call with error handling
          HTTP_CODE=$(curl -s -w "%{http_code}" -o response.json \
            https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://github.com/${{ github.repository }}" \
            -H "X-Title: PR Description Generator" \
            -d @payload.json)

          # Debug output
          echo "HTTP Status: $HTTP_CODE"
          echo "Response:"
          cat response.json

          # Check if request succeeded
          if [ "$HTTP_CODE" != "200" ]; then
            echo "API request failed with status $HTTP_CODE"
            ERROR_MSG=$(jq -r '.error.message // "Unknown error"' response.json)
            echo "Error: $ERROR_MSG"
            echo "description=⚠️ Failed to generate description. API returned: $ERROR_MSG" >> $GITHUB_OUTPUT
            exit 0  # Don't fail the workflow
          fi

          # Extract description
          DESCRIPTION=$(jq -r '.choices[0].message.content // empty' response.json)

          if [ -z "$DESCRIPTION" ]; then
            echo "No content in API response"
            echo "description=⚠️ API returned empty response. Please check workflow logs." >> $GITHUB_OUTPUT
            exit 0
          fi

          # Save description
          {
            echo "description<<EOF"
            echo "$DESCRIPTION"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Update PR body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### AI-Generated Pull Request Summary"
            echo ""
            echo "${{ steps.ai.outputs.description }}"
          } > new_body.txt

          gh pr edit ${{ github.event.pull_request.number }} --body-file new_body.txt
