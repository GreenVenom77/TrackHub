name: "AI Pull Request Description Generator"

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  generate-description:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

      - name: Get commit messages and code changes
        id: context
        run: |
          {
            echo "### Commit Messages"
            git log --pretty=format:"- %s" origin/${{ github.event.pull_request.base.ref }}..HEAD || echo "(No commits)"
            
            echo -e "\n\n### Files Changed"
            git diff --name-status --diff-filter=AM origin/${{ github.event.pull_request.base.ref }}..HEAD || echo "(No files)"
            
            echo -e "\n\n### Added/Modified Code (Key Signatures)"
            # Show actual added lines with function/class declarations
            git diff origin/${{ github.event.pull_request.base.ref }}..HEAD | grep '^+' | grep -v '^+++' | grep -E '(fun |class |interface |object |data class |sealed |@Composable|suspend |override |val |var |enum )' | sed 's/^+//' | head -200 || echo "(No signatures)"
            
            echo -e "\n\n### Full Diff"
            git diff origin/${{ github.event.pull_request.base.ref }}..HEAD
          } > context.txt
          
          {
            echo "context<<CONTEXTEOF"
            cat context.txt
            echo "CONTEXTEOF"
          } >> $GITHUB_OUTPUT

      - name: Generate AI Pull Request Description
        id: ai
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Create a STRICT prompt that prevents hallucination
          echo "You are writing a technical GitHub Pull Request description for experienced Android/Kotlin developers.

          ⚠️ CRITICAL ANTI-HALLUCINATION RULES ⚠️
          1. ONLY describe changes you can SEE in the provided diff/commits
          2. NEVER EVER use placeholder commas like: 'Added functions , , , and'
          3. If you see a function name like 'inviteUser()', COPY IT EXACTLY: 'inviteUser()'
          4. If you cannot see a function name clearly, DO NOT mention functions at all - describe the feature generically
          5. REAL EXAMPLE FROM DIFF: If you see '+    suspend fun getMemberList(): Flow<Result<List<HubMember>>>'
             Then write: 'getMemberList(): Flow<Result<List<HubMember>>>'
          6. NEVER write: 'Added functions , , , and' - THIS IS FORBIDDEN
          7. Include technical specifics ONLY when you can see them in the diff

          Write a technical PR description with:

          ## Summary
          2-3 sentences about what changed technically and the architectural approach

          ## Technical Changes
          4-6 bullet points with implementation details. Format:
          **Component/Layer**: Technical description with ACTUAL function/class names you see, or generic description if names aren't visible

          GOOD examples (with actual names from diff):
          - **HubMemberRepository**: Added getMemberList(): Flow<Result<List<HubMember>>>, updateMemberRole(memberId: String, role: HubRole), and removeMember(memberId: String) for reactive member management
          - **User invitation flow**: Implemented InvitationViewModel with StateFlow<List<InvitableUser>>, searchUsers(query: String) with 600ms debouncing
          - **Domain models**: Created HubMember data class with userId/role/status fields, HubRole enum (OWNER/EDITOR/VIEWER)

          ACCEPTABLE generic examples (when you can't see names):
          - **Data source layer**: Implemented Supabase RPC integration for member operations with proper status filtering
          - **UI Components**: Added Composable screens for member management with lazy loading and debounced search

          FORBIDDEN examples (NEVER DO THIS):
          - **Repository**: Added functions , , , and for member management ❌
          - **Data source**: Implemented methods , , and ❌
          - **ViewModel**: Created , , with state flows ❌

          REMEMBER: Empty placeholders are WORSE than being generic. If you can't see the name, describe the WHAT not the WHO.

          Context:
          " > prompt.txt
          
          cat context.txt >> prompt.txt

          # Try multiple models in priority order (best free models for code analysis)
          MODELS=(
            "google/gemini-2.5-flash:free"           # Best: fast, 1M context, great at summaries
            "deepseek/deepseek-chat-v3-0324:free"    # Excellent for code tasks
            "meta-llama/llama-3.3-70b-instruct:free" # Strong instruction following
            "google/gemini-2.0-flash-exp:free"       # Experimental, cutting-edge
            "nvidia/llama-3.1-nemotron-ultra-253b-v1:free" # Most powerful fallback
          )
          
          for MODEL in "${MODELS[@]}"; do
            echo "Trying model: $MODEL"
            
            jq -n \
              --arg model "$MODEL" \
              --arg system "You write accurate PR descriptions based only on provided context. Never hallucinate details." \
              --rawfile prompt prompt.txt \
              '{
                model: $model,
                messages: [
                  {role: "system", content: $system},
                  {role: "user", content: $prompt}
                ],
                max_tokens: 800,
                temperature: 0.3
              }' > payload.json

            HTTP_CODE=$(curl -s -w "%{http_code}" -o response.json \
              https://openrouter.ai/api/v1/chat/completions \
              -H "Authorization: Bearer $OPENROUTER_API_KEY" \
              -H "Content-Type: application/json" \
              -H "HTTP-Referer: https://github.com/${{ github.repository }}" \
              -H "X-Title: PR Description Generator" \
              -d @payload.json)

            echo "HTTP Status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              DESCRIPTION=$(jq -r '.choices[0].message.content // empty' response.json)
              
              if [ -n "$DESCRIPTION" ]; then
                echo "Success with model: $MODEL"
                {
                  echo "description<<DESCEOF"
                  echo "$DESCRIPTION"
                  echo "DESCEOF"
                } >> $GITHUB_OUTPUT
                exit 0
              fi
            else
              echo "Failed with $MODEL, trying next..."
              cat response.json
            fi
          done
          
          # If all models failed
          echo "All models failed"
          {
            echo "description<<DESCEOF"
            echo "⚠️ Failed to generate AI description. Please check workflow logs for details."
            echo ""
            echo "### Manual Summary Needed"
            echo "Please add a description for this PR."
            echo "DESCEOF"
          } >> $GITHUB_OUTPUT

      - name: Update PR body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "### AI-Generated Pull Request Summary" > new_body.txt
          echo "" >> new_body.txt
          echo "${{ steps.ai.outputs.description }}" >> new_body.txt
          echo "" >> new_body.txt
          echo "---" >> new_body.txt
          echo "*Generated by AI - please review and edit as needed*" >> new_body.txt
          
          gh pr edit ${{ github.event.pull_request.number }} --body-file new_body.txt
