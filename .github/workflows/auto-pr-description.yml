name: "AI Pull Request Description Generator"

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  generate-description:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for proper diffs

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

      - name: Get commit messages and diff summary (safe)
        id: context
        run: |
          echo "### Commits" > context.txt
          git log --pretty=format:"- %s" origin/${{ github.event.pull_request.base.ref }}..HEAD >> context.txt || echo "(No commits found)" >> context.txt
          echo -e "\n\n### Diff Summary" >> context.txt
          git diff --stat origin/${{ github.event.pull_request.base.ref }}..HEAD >> context.txt || echo "(No diff found)" >> context.txt

          # Truncate context if too large (>25KB) to avoid hitting API limits
          MAX_BYTES=25000
          ACTUAL_BYTES=$(wc -c < context.txt)
          if [ "$ACTUAL_BYTES" -gt "$MAX_BYTES" ]; then
            echo -e "\n\n[Note: diff truncated for size]" >> context.txt
            head -c $MAX_BYTES context.txt > truncated.txt && mv truncated.txt context.txt
          fi

          echo "context<<EOF" >> $GITHUB_OUTPUT
          cat context.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate AI Pull Request Description
        id: ai
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"openai/gpt-oss-20b:free\",
              \"messages\": [
                {
                  \"role\": \"system\",
                  \"content\": \"You are an AI assistant that writes clear, concise, and professional GitHub Pull Request descriptions.\"
                },
                {
                  \"role\": \"user\",
                  \"content\": \"You are writing a PR description for both stakeholders and developers. Balance business value with technical clarity.\\n\\nGenerate a pull request description in Markdown format with these sections:\\n\\n## Summary\\nOne clear paragraph explaining WHAT was built, WHY it matters, and the BUSINESS VALUE or technical benefit.\\n\\n## Key Changes\\n4-8 bullet points covering the most important changes. Each bullet should follow this structure:\\n- **What changed** (user/business perspective) — **How it was implemented** (technical approach, key tools/libraries used)\\n\\nExample format:\\n- Added filtering system for Hub items by category and manufacturer — Implemented using a custom FilterDropdown component with multi-select support and ViewModel state management\\n- Improved data synchronization performance — Refactored HubRepository to use Kotlin Coroutines with Flow-based paging (androidx.paging3)\\n\\nGUIDELINES:\\n- Lead with the WHAT/WHY, follow with the HOW\\n- Include key technologies, libraries, or architectural patterns used (e.g., Retrofit, Room, Compose, MVVM)\\n- Mention important classes or components ONLY when they help developers understand the approach\\n- NO line counts, file counts, or granular implementation details\\n- NO repetition between sections\\n- Skip minor changes (formatting, imports, config tweaks)\\n- If commit messages are vague, analyze the diff to infer the actual purpose\\n\\nContext:\\n${{ steps.context.outputs.context }}\"
                }
              ]
            }")

          DESCRIPTION=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "No description generated."')
          echo "description<<EOF" >> $GITHUB_OUTPUT
          echo "$DESCRIPTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Overwrite PR body completely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### AI-Generated Pull Request Summary"
            echo ""
            echo "${{ steps.ai.outputs.description }}"
          } > new_body.txt

          gh pr edit ${{ github.event.pull_request.number }} --body-file new_body.txt
