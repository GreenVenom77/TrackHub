name: "AI Pull Request Description Generator"

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  generate-description:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for proper diffs

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

      - name: Get commit messages and diff summary (safe)
        id: context
        run: |
          echo "### Commits" > context.txt
          git log --pretty=format:"- %s" origin/${{ github.event.pull_request.base.ref }}..HEAD >> context.txt || echo "(No commits found)" >> context.txt
          echo -e "\n\n### Diff Summary" >> context.txt
          git diff --stat origin/${{ github.event.pull_request.base.ref }}..HEAD >> context.txt || echo "(No diff found)" >> context.txt

          # Truncate context if too large (>25KB) to avoid hitting API limits
          MAX_BYTES=25000
          ACTUAL_BYTES=$(wc -c < context.txt)
          if [ "$ACTUAL_BYTES" -gt "$MAX_BYTES" ]; then
            echo -e "\n\n[Note: diff truncated for size]" >> context.txt
            head -c $MAX_BYTES context.txt > truncated.txt && mv truncated.txt context.txt
          fi

          echo "context<<EOF" >> $GITHUB_OUTPUT
          cat context.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate AI Pull Request Description
        id: ai
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"mistralai/devstral-small-2505:free\",
              \"messages\": [
                {
                  \"role\": \"system\",
                  \"content\": \"You are an AI assistant that writes clear, concise, and professional GitHub Pull Request descriptions.\"
                },
                {
                  \"role\": \"user\",
                  \"content\": \"You are writing a detailed technical PR description for developers who need to understand the exact implementation. Be specific with code-level details.\\n\\nGenerate a pull request description in Markdown format with these sections:\\n\\n## Summary\\n2-3 sentences describing the technical implementation and architectural changes.\\n\\n## Technical Changes\\n4-7 bullet points with detailed implementation specifics. Format:\\n- **Component/Layer** — **Detailed implementation** (specific methods, properties, parameters, key logic)\\n\\nExample format:\\n- FilterDropdown composable — Created reusable component with `selectedItems: StateFlow<List<T>>` and `onSelectionChange: (List<T>) -> Unit` callbacks, uses LazyColumn for item rendering with Checkbox composables, handles keyboard interactions and clear-all functionality\\n- HubRepository filtering — Added `categoryIds: List<String>?` and `manufacturerIds: List<String>?` parameters to `getHubItems()`, modified Room @Query to use `IN (:categoryIds)` clauses, returns `Flow<PagingData<HubItem>>` using Pager configuration with pageSize=20\\n- ItemDao queries — Implemented `@Query(\\\"SELECT * FROM items WHERE (:categoryIds IS NULL OR category_id IN (:categoryIds))\\\" )` with optional filtering, added indexes on category_id and manufacturer_id columns for query optimization\\n\\nGUIDELINES:\\n- Include specific method signatures, parameter names, and return types\\n- Mention SQL queries, database annotations (@Query, @Insert, @Update), and schema changes\\n- Describe state management approach (StateFlow, MutableState, ViewModel properties)\\n- Include Compose component details (remember, LaunchedEffect, collectAsState)\\n- Specify API request/response field changes\\n- Mention dependency injection changes (Hilt modules, @Provides methods)\\n- Include navigation changes and screen parameter updates\\n- Describe data transformation logic (mappers, DTOs)\\n- Each bullet should give enough detail that a developer understands the implementation without reading code\\n- BANNED: LOC, file counts, vague descriptions like 'updated to support', 'enhanced', 'improved'\\n- Be specific: Instead of 'added filtering support' say 'added categoryIds: List<String>? parameter to getHubItems() method with Room IN clause'\\n\\nContext:\\n${{ steps.context.outputs.context }}\"
                }
              ]
            }")

          DESCRIPTION=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "No description generated."')
          echo "description<<EOF" >> $GITHUB_OUTPUT
          echo "$DESCRIPTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Overwrite PR body completely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### AI-Generated Pull Request Summary"
            echo ""
            echo "${{ steps.ai.outputs.description }}"
          } > new_body.txt

          gh pr edit ${{ github.event.pull_request.number }} --body-file new_body.txt
