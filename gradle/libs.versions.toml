[versions]
# ----------------------------
# 🔧 Core / Build
# ----------------------------
agp = "9.1.1"
kotlin = "2.3.21"
ksp = "2.3.6"

coreKtx = "1.18.0"
coreSplashscreen = "1.2.0"
lifecycle = "2.10.0"
kotlinxSerializationJson = "1.11.0"

# ----------------------------
# 🎨 UI (Compose)
# ----------------------------
composeBom = "2026.05.00"
activityCompose = "1.13.0"
material3 = "1.4.0"
composeNavigation = "2.9.7"
nav3Core = "1.1.1"
composeShimmer = "1.4.0"
materialIconsExtended = "1.7.8"
lumo = "1.2.5"

# ----------------------------
# 🧪 Testing
# ----------------------------
junit4 = "4.13.2"
junit5 = "6.0.3"
androidxJunit = "1.3.0"
espresso = "3.7.0"

kotest = "6.1.11"
mockk = "1.14.9"

# ----------------------------
# 🧩 Dependency Injection
# ----------------------------
koin = "4.2.1"

# ----------------------------
# 🌐 Network
# ----------------------------
ktor = "3.4.3"
supabase = "3.6.0"

# ----------------------------
# 💾 Data
# ----------------------------
datastore = "1.2.1"
libphonenumber-android = "9.0.29"
room = "2.8.4"
paging = "3.5.0"

# ----------------------------
# 🖼️ Image Loading
# ----------------------------
coil = "3.4.0"

# ----------------------------
# 🧱 Legacy / Views
# ----------------------------
appcompat = "1.7.1"
material = "1.13.0"

# ============================
# 📦 Libraries
# ============================

[libraries]

# -------- Core --------
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# -------- Lifecycle --------
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# -------- Compose --------
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-navigation = { module = "androidx.navigation:navigation-compose", version.ref = "composeNavigation" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }


androidx-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIconsExtended" }

compose-shimmer = { module = "com.valentinilk.shimmer:compose-shimmer", version.ref = "composeShimmer" }

# Compose UI (no versions → BOM)
androidx-ui = { module = "androidx.compose.ui:ui" }
androidx-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

# -------- Compose Testing --------
androidx-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# -------- Paging --------
androidx-paging-runtime = { module = "androidx.paging:paging-runtime", version.ref = "paging" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }

# -------- Testing --------

# JUnit 5
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5" }

# JUnit 4 (legacy / Android)
junit = { module = "junit:junit", version.ref = "junit4" }

# AndroidX Test
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

# Kotest
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }

# MockK
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# -------- Dependency Injection --------
koin-android-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
koin-android-compose-navigation = { module = "io.insert-koin:koin-compose-navigation3", version.ref = "koin" }

# -------- Network (Ktor) --------
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }

# -------- Supabase --------
supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabase" }
supabase-auth = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
supabase-realtime = { module = "io.github.jan-tennert.supabase:realtime-kt" }
supabase-storage = { module = "io.github.jan-tennert.supabase:storage-kt" }
supabase-coil = { module = "io.github.jan-tennert.supabase:coil3-integration" }

# -------- Data (Room / Datastore) --------
androidx-datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
libphonenumber-android = { module = "io.michaelrocks:libphonenumber-android", version.ref = "libphonenumber-android" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-paging = { module = "androidx.room:room-paging", version.ref = "room" }

# -------- Image Loading --------
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

# -------- Legacy Views --------
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
google-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
lumo = { id = "com.nomanr.plugin.lumo", version.ref = "lumo" }

[bundles]

dependency-injection = [
    "koin-android-compose",
    "koin-android-compose-navigation"
]

compose-main = [
    "androidx-activity-compose",
    "androidx-material3",
    "androidx-ui",
    "androidx-ui-graphics",
    "androidx-ui-tooling-preview",
]

compose-lifecycle = [
    "androidx-lifecycle-runtime-compose",
    "androidx-lifecycle-viewmodel-compose"
]

compose-navigation = [
    "androidx-compose-navigation",
    "androidx-navigation3-runtime",
    "androidx-navigation3-ui",
    "androidx-lifecycle-viewmodel-navigation3",
]

compose-debug = [
    "androidx-ui-tooling",
    "androidx-ui-test-manifest",
]

local-data-persistence = [
    "androidx-datastore",
    "androidx-room-ktx",
    "androidx-room-paging",
    "androidx-room-runtime",
    "androidx-paging-runtime",
    "androidx-paging-compose",
]

supabase = [
    "supabase-postgrest",
    "supabase-realtime",
    "supabase-storage",
    "supabase-auth",
    "supabase-coil",
    "ktor-client-cio",
    "ktor-client-logging",
]